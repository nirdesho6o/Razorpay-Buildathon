<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MerchantAgent — Live Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid #222;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.5px;
  }
  header .session-id {
    font-size: 12px;
    color: #666;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #444;
    margin-right: 8px;
    animation: pulse 2s ease-in-out infinite;
  }
  .status-dot.connected { background: #22c55e; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .main-panels {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  .panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 12px 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    border-bottom: 1px solid #1a1a1a;
    flex-shrink: 0;
  }

  /* Left panel — conversation */
  .conversation-panel {
    flex: 55;
    border-right: 1px solid #1a1a1a;
  }
  .conversation {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .bubble .time {
    font-size: 10px;
    color: #666;
    margin-top: 4px;
  }
  .bubble.buyer {
    align-self: flex-start;
    background: #1a2744;
    border: 1px solid #2a3f66;
    color: #93b5f1;
  }
  .bubble.merchant {
    align-self: flex-end;
    background: #1a3a3a;
    border: 1px solid #2a5555;
    color: #7ed4c8;
  }
  .bubble.system {
    align-self: center;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #999;
    font-size: 12px;
    padding: 6px 12px;
  }

  /* Right panel — audit trail */
  .audit-panel {
    flex: 45;
  }
  .audit-table {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 11px;
  }
  .audit-table table {
    width: 100%;
    border-collapse: collapse;
  }
  .audit-table th {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid #333;
    color: #888;
    font-weight: 500;
    position: sticky;
    top: 0;
    background: #0a0a0a;
  }
  .audit-table td {
    padding: 5px 8px;
    border-bottom: 1px solid #151515;
    vertical-align: top;
  }
  .audit-table tr {
    animation: fadeIn 0.3s ease;
  }
  .event-success { color: #22c55e; }
  .event-error { color: #ef4444; }
  .event-info { color: #888; }

  /* Bottom strip — pipeline */
  .pipeline {
    padding: 14px 24px;
    border-top: 1px solid #222;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    background: #0d0d0d;
  }
  .step {
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    background: #1a1a1a;
    color: #555;
    border: 1px solid #222;
    transition: all 0.3s ease;
  }
  .step.active {
    background: #1a2744;
    color: #6b9cf7;
    border-color: #2a3f66;
  }
  .step.done {
    background: #122a1a;
    color: #22c55e;
    border-color: #1a4a2a;
  }
  .step.error {
    background: #2a1515;
    color: #ef4444;
    border-color: #4a2222;
    animation: flashRed 0.5s ease;
  }
  @keyframes flashRed {
    0%, 100% { background: #2a1515; }
    50% { background: #3a1515; }
  }
  .step-arrow {
    color: #333;
    font-size: 14px;
  }

  .waiting {
    color: #444;
    font-style: italic;
    text-align: center;
    padding: 40px;
    font-size: 13px;
  }

  @media (max-width: 900px) {
    .main-panels {
      flex-direction: column;
    }
    .conversation-panel {
      border-right: none;
      border-bottom: 1px solid #1a1a1a;
      flex: 1;
    }
    .audit-panel {
      flex: 1;
    }
  }
</style>
</head>
<body>

<header>
  <div>
    <span class="status-dot" id="statusDot"></span>
    <h1 style="display:inline">MerchantAgent — Live Demo</h1>
  </div>
  <span class="session-id" id="sessionId">Waiting for session...</span>
</header>

<div class="main-panels">
  <div class="panel conversation-panel">
    <div class="panel-header">Agent Conversation</div>
    <div class="conversation" id="conversation">
      <div class="waiting">Waiting for demo to start...</div>
    </div>
  </div>
  <div class="panel audit-panel">
    <div class="panel-header">Audit Trail</div>
    <div class="audit-table" id="auditTable">
      <table>
        <thead><tr><th>Time</th><th>Event</th><th>Details</th></tr></thead>
        <tbody id="auditBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="pipeline">
  <span class="step" data-phase="searching">Searching</span>
  <span class="step-arrow">→</span>
  <span class="step" data-phase="negotiating">Negotiating</span>
  <span class="step-arrow">→</span>
  <span class="step" data-phase="checkout">Checkout</span>
  <span class="step-arrow">→</span>
  <span class="step" data-phase="paying">Paying</span>
  <span class="step-arrow">→</span>
  <span class="step" data-phase="complete">✓ Complete</span>
</div>

<script>
const PHASE_ORDER = ['searching', 'negotiating', 'checkout', 'paying', 'complete'];
let currentPhase = null;
let firstEvent = true;

const conversation = document.getElementById('conversation');
const auditBody = document.getElementById('auditBody');
const sessionIdEl = document.getElementById('sessionId');
const statusDot = document.getElementById('statusDot');

const eventSource = new EventSource('/events');

eventSource.onopen = () => {
  statusDot.classList.add('connected');
};

eventSource.onerror = () => {
  statusDot.classList.remove('connected');
};

eventSource.onmessage = (event) => {
  const data = JSON.parse(event.data);

  if (firstEvent) {
    conversation.innerHTML = '';
    firstEvent = false;
  }

  if (data.session_id) {
    sessionIdEl.textContent = data.session_id;
  }

  addBubble(data);
  addAuditRow(data);
  updatePipeline(data.display?.phase);
};

function addBubble(data) {
  const display = data.display || {};
  const actor = display.actor || 'system';
  const summary = display.summary || data.event_type;
  const ts = formatTime(data.timestamp);

  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + actor;
  bubble.innerHTML = '<div>' + escapeHtml(summary) + '</div><div class="time">' + ts + '</div>';
  conversation.appendChild(bubble);
  conversation.scrollTop = conversation.scrollHeight;
}

function addAuditRow(data) {
  const ts = formatTime(data.timestamp);
  const eventType = data.event_type || '';
  const payload = data.payload || {};

  let style = 'event-info';
  if (eventType.includes('succeeded') || eventType.includes('completed') || eventType.includes('accept')) {
    style = 'event-success';
  } else if (eventType.includes('failed') || eventType.includes('expired')) {
    style = 'event-error';
  }

  const details = formatAuditDetails(eventType, payload);

  const tr = document.createElement('tr');
  tr.innerHTML =
    '<td style="color:#666">' + ts + '</td>' +
    '<td class="' + style + '">' + escapeHtml(eventType) + '</td>' +
    '<td>' + escapeHtml(details) + '</td>';
  auditBody.appendChild(tr);

  const tableContainer = document.getElementById('auditTable');
  tableContainer.scrollTop = tableContainer.scrollHeight;
}

function updatePipeline(phase) {
  if (!phase) return;

  const steps = document.querySelectorAll('.step');
  const phaseIndex = PHASE_ORDER.indexOf(phase);
  if (phaseIndex === -1) return;

  steps.forEach((step) => {
    const stepPhase = step.dataset.phase;
    const stepIndex = PHASE_ORDER.indexOf(stepPhase);

    step.classList.remove('active', 'done', 'error');

    if (phase === 'failed' && stepPhase === 'paying') {
      step.classList.add('error');
    } else if (stepIndex < phaseIndex) {
      step.classList.add('done');
    } else if (stepIndex === phaseIndex) {
      step.classList.add('active');
    }
  });

  currentPhase = phase;
}

function formatAuditDetails(eventType, payload) {
  switch (eventType) {
    case 'catalog_search':
      return 'query="' + (payload.query || '') + '"';
    case 'catalog_results':
      return 'found ' + (payload.count || 0) + ' products';
    case 'negotiate_request':
      return 'round=' + (payload.round || 1) + ', proposed=₹' + (payload.proposed_total || 0).toLocaleString('en-IN');
    case 'negotiate_decision':
      return (payload.decision || '') + ', computed=₹' + (payload.computed_total || 0).toLocaleString('en-IN') +
             ', rules=' + (payload.rules_fired || []).length;
    case 'order_created':
      return 'order=' + (payload.razorpay_order_id || '') + ', ₹' + ((payload.amount || 0) / 100).toLocaleString('en-IN');
    case 'payment_attempted':
      return 'attempt=' + (payload.attempt || 1) + ', ' + (payload.status || '');
    case 'payment_failed':
      return 'attempt=' + (payload.attempt || 1) + ', retry in ' + (payload.retry_delay || 3) + 's';
    case 'payment_succeeded':
      return 'payment_id=' + (payload.payment_id || '');
    case 'order_completed':
      return 'payment_id=' + (payload.payment_id || '');
    default:
      return JSON.stringify(payload).substring(0, 60);
  }
}

function formatTime(ts) {
  if (!ts) return '';
  try {
    const d = new Date(ts);
    return d.toTimeString().substring(0, 8);
  } catch {
    return ts.split('T')[1]?.substring(0, 8) || ts;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
